---
layout: default
---
<div class="post-feed">
  {% for post in site.posts %}
  <article class="post-card">
    <h2 class="post-card__title">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>
    <time class="post-card__date" datetime="{{ post.date | date_to_xmlschema }}">
      {{ post.date | date: "%B %-d, %Y" }}
    </time>
    <p class="post-card__excerpt">{{ post.excerpt | strip_html | truncatewords: 50 }}</p>
    <a class="post-card__read-more" href="{{ post.url | relative_url }}">Read more →</a>
  </article>
  {% endfor %}

  {% if site.posts.size == 0 %}
  <p class="empty-feed">No posts yet. Check back soon!</p>
  {% endif %}
</div>
