<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__branding">
      <a href="{{ '/' | relative_url }}" class="site-header__title">{{ site.title }}</a>
    </div>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-nav__link {% if page.url == '/' %}site-nav__link--active{% endif %}">Feed</a>
      <a href="{{ '/projects/' | relative_url }}" class="site-nav__link {% if page.url == '/projects/' %}site-nav__link--active{% endif %}">Projects</a>
      <a href="{{ '/about/' | relative_url }}" class="site-nav__link {% if page.url == '/about/' %}site-nav__link--active{% endif %}">About</a>
    </nav>
  </div>
</header>
